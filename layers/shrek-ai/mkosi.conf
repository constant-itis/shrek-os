# Shrek OS — the shrek-ai optional AI-layer sysext Onion (ADR-006 M1, docs/adr-006-optional-ai-layer.md +
# docs/adr-006-slice1-onion-skeleton.md). The optional on-device AI layer: an on-box small model + an on-box
# mycelium serving a self-knowledge brain, hooked to the sealed skeleton (Mode A — offline, zero egress).
#
# SLICE 1 = SKELETON ONLY. This DDI carries just the Onion identity marker (/usr/lib/shrek/layers/ai), same
# marker-only shape as shrek-hello — NO packages yet. The Mode-A process set enumerated in ADR-006 §3
# (the llama.cpp-class inference server, the on-box mycelium runtime, the `shrek ai` shell front-door, the
# baked seed brain) lands in later slices; this slice locks the packaging/enablement WIRING and proves
# absent-tolerance (a box built without INCLUDE_AI=1 takes no new failure — exactly like shrek-dev/bench).
#
# Built by scripts/build-ai-layer.sh as a signed dm-verity sysext; scripts/build-layers.sh stages it into
# the layer store when INCLUDE_AI=1, and the sealed onion-policy (`enable shrek-ai`) makes oniond propose it.
# Verity/signing keys are passed on the CLI by the build script so this config stays key-path-agnostic.
[Distribution]
Distribution=debian
Release=trixie

[Output]
# Format=sysext auto-generates /usr/lib/extension-release.d/extension-release.shrek-ai with ID=debian
# VERSION_ID=13 so it matches the sealed base at merge time (same as shrek-hello/shrek-dev/shrek-bench).
Format=sysext
ImageId=shrek-ai
Output=shrek-ai
OutputDirectory=../../out/layers
CompressOutput=no

[Content]
# Slice 4: the on-box memory service (overlay/usr/lib/shrek/ai/shrek-ai-mycelium) is a stdlib python3
# implementation of the Shrek Memory API, so the Onion now carries the python3 RUNTIME — the first package
# in the AI Onion. The sealed BASE is deliberately python-free (all base helpers are #!/bin/sh); only an
# INCLUDE_AI box gets python3, and only via this layer. sqlite3 + FTS5 ride in libsqlite3 pulled by
# python3. NO pip closure (owner decision 2026-09-02: no FastMCP/pydantic/uvicorn in the sealed image).
# Because there are now Packages=, scripts/build-ai-layer.sh builds this with `--base-tree <sealed base>
# --overlay` so only the genuinely-new python files land in the DDI (not a duplicate libc/systemd) — the
# same overlay-delta idiom as shrek-dev/shrek-bench.
Packages=
        python3
ExtraTrees=overlay

# Shrek OS INSTALL-0 Calamares configuration.
---
modules-search: [ local, /usr/lib/calamares/modules ]
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: false
quit-at-end: false

# INSTALL-0 is a whole-disk image writer. The target disk is chosen by the
# Shrek-owned picker in shrek-install-calamares (not Calamares' partition
# module), and locale/keyboard/user selections are not consumed by the deploy
# job, so the interactive surface is reduced to a confirm + deploy + finished.
sequence:
- show:
  - summary
- exec:
  - shrekdeploy
- show:
  - finished

branding: shrek
prompt-install: true
dont-chroot: false

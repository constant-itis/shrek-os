# Shrek OS — live installer sysext layer (INSTALL-0).
#
# The Quickshell graphical installer (ui-installer/, staged into the overlay) is the human-facing surface;
# it hands off to shrek-install-run, which drives the deployment job that writes the immutable Shrek disk
# layout from the already-built image artifacts. This layer carries the live-environment tools that surface
# only on installer media (zenity chooser, GParted, a browser, disk utilities).
[Distribution]
Distribution=debian
Release=trixie

[Output]
Format=sysext
ImageId=shrek-installer
Output=shrek-installer
OutputDirectory=../../out/layers
CompressOutput=no

[Content]
Packages=
        pkexec
        zenity
        console-setup
        firefox-esr
        gparted
        gdisk
        parted
        binutils
        dosfstools
        e2fsprogs
        util-linux
        pciutils
        usbutils
        rfkill
        ethtool
        dnsutils
        traceroute
        lsof
        jq
        ripgrep
        fd-find
        unzip
        zip
        curl
        wget
        openssh-client
ExtraTrees=overlay

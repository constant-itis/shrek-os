# Shrek OS — live installer sysext layer (INSTALL-0).
#
# Calamares is the human-facing installer UI. Shrek only supplies the deployment job that writes the
# immutable Shrek disk layout from the already-built image artifacts.
[Distribution]
Distribution=debian
Release=trixie

[Output]
Format=sysext
ImageId=shrek-installer
Output=shrek-installer
OutputDirectory=../../out/layers
CompressOutput=no

[Content]
Packages=
        calamares=3.3.14-1
        calamares-settings-debian=13.0.13-1
        pkexec
        zenity
        console-setup
        firefox-esr
        gparted
        gdisk
        parted
        binutils
        dosfstools
        e2fsprogs
        util-linux
        pciutils
        usbutils
        rfkill
        ethtool
        dnsutils
        traceroute
        lsof
        jq
        ripgrep
        fd-find
        unzip
        zip
        curl
        wget
        openssh-client
ExtraTrees=overlay

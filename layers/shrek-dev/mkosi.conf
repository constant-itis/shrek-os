# Shrek OS — the shrek-dev sysext Onion layer (Dogfood-0 M2, docs/dogfood-0.md §M2). Carries the MINIMUM
# toolchain to build + test the shrek-os workspace IN the box (the dogfood workload) as a signed dm-verity
# sysext merged onto the sealed /usr. Like shrek-desktop it INSTALLS packages — they land in /usr, which
# the sysext overlays; scripts/build-dev-layer.sh builds it with `--base-tree <sealed-base closure>
# --overlay` so only the genuinely-new toolchain files land in the DDI (not a duplicate libc/systemd).
#
# Toolchain scope is deliberately minimal (owner directive): the workspace is edition-2021, minimal-deps
# (the sealed default-members compile OFFLINE with ZERO registry crates — verified 2026-08-22 in a clean
# trixie container), so trixie's STOCK rustc 1.85 builds + tests it. No rustup, no pinned 1.95 vendoring,
# no mkosi/qemu/docker/heavy IDE. An editor (nano) already ships in the sealed base.
[Distribution]
Distribution=debian
Release=trixie

[Output]
# Format=sysext auto-generates /usr/lib/extension-release.d/extension-release.shrek-dev with
# ID=debian VERSION_ID=13 so it matches the sealed base at merge time (same as shrek-desktop).
Format=sysext
ImageId=shrek-dev
Output=shrek-dev
OutputDirectory=../../out/layers
CompressOutput=no

[Content]
# Rust + a C toolchain (rusqlite `bundled` builds SQLite from C via cc; `ring` compiles C/asm — both live
# in the BROKER crates excluded from the sealed set, but the dev box builds the WHOLE workspace) +
# pkg-config + git. build-essential pulls gcc/g++/make/libc6-dev/dpkg-dev.
Packages=
        rustc                   # trixie 1.85.0 — satisfies the edition-2021 workspace (no MSRV pin)
        cargo
        build-essential         # cc/g++/make/binutils/libc6-dev — links ring's C/asm + rusqlite bundled
        pkg-config
        git
# overlay/usr/bin/{cc,c++}: a sysext merges ONLY /usr, never /etc — but Debian's `cc`/`c++` are
# update-alternatives symlinks routing through /etc/alternatives, which the sealed base's /etc does not
# carry, so they DANGLE in the merged image and rustc's link step (it invokes `cc`) fails. We bake
# concrete /usr-internal symlinks (cc→gcc→gcc-14, c++→g++→g++-14) that resolve entirely within the merged
# /usr. `ld`/`as` are direct in-/usr symlinks (not alternatives), so they need no fix.
ExtraTrees=overlay

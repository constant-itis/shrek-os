# Shrek OS — Bench-0 (ADR-003 Part 2). Rootless container storage for `dev`'s Benches lives on the
# PERSISTENT /home plane (label shrek-data), NOT volatile /var (tmpfs) and NOT the 128M swamp-state.
# This is podman's system default config (/usr/share/containers/storage.conf), readable even though the
# runtime /etc is sealed read-only.
#
# rootless_storage_path is the ROOTLESS graphroot knob: a plain `graphroot` here would be overridden by
# podman's rootless default ($HOME/.local/share/containers). The bench pool at /home/.shrek/benches is
# mounted noexec,nosuid,nodev; container exec still works because podman's overlay merged rootfs is a
# FRESH superblock that does not inherit the pool's noexec (ADR-003 rule 2, proven bench0-prevalidate).
[storage]
driver = "overlay"
rootless_storage_path = "/home/.shrek/benches/storage"

[storage.options]
# No mount_program set → NATIVE rootless overlay (used on trixie's kernel; proven bench0-prevalidate).
# fuse-overlayfs stays installed as the manual fallback; vfs is FORBIDDEN (bind rootfs inherits noexec).

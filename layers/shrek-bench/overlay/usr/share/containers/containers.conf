# Shrek OS — Bench-0 (ADR-003 Part 2). Podman engine defaults for the Bench plane, baked at podman's
# native system config path so they apply even though runtime /etc is sealed read-only.
[engine]
# Redirect the image-pull staging dir OFF volatile /var (podman defaults image_copy_tmp_dir to /var/tmp,
# which is tmpfs here → a large pull would eat RAM and die). Point it at the persistent /home bench pool.
image_copy_tmp_dir = "/home/.shrek/benches/tmp"
# cgroup manager is left at the default (systemd) so a bench lands under dev's delegated user-1000.slice
# (dev's user@1000 manager is active via pam_systemd). events default (journald) is fine.

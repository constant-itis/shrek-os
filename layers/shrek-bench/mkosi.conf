# Shrek OS — the shrek-bench sysext Onion layer (Bench-0, ADR-003 Part 2). Carries the rootless-container
# runtime substrate for the Bench plane (mutable user compute) as a signed dm-verity sysext merged onto
# the sealed /usr. Like shrek-desktop/shrek-dev it INSTALLS packages into /usr; scripts/build-bench-layer.sh
# builds it with `--base-tree <sealed-base closure> --overlay` so only the genuinely-new runtime files land
# in the DDI. All packages are stock trixie main (no OBS). Verified viable in a debian:trixie container
# first (scratchpad bench0-prevalidate: native rootless overlay + noexec-pool exec + subuid all green).
#
# subuid/subgid: the uid RANGE for `dev` is baked into the sealed /etc by image/mkosi.postinst (a sysext
# extends /usr only and cannot touch /etc); the `uidmap` PACKAGE below ships the setuid newuidmap/newgidmap
# helpers that consume that range to map a full 65536-wide user namespace.
[Distribution]
Distribution=debian
Release=trixie

[Output]
# Format=sysext auto-generates /usr/lib/extension-release.d/extension-release.shrek-bench with
# ID=debian VERSION_ID=13 so it matches the sealed base at merge time (same as shrek-desktop/shrek-dev).
Format=sysext
ImageId=shrek-bench
Output=shrek-bench
OutputDirectory=../../out/layers
CompressOutput=no

[Content]
# Bench plane runtime (ADR-003 Part 2, Fable-reviewed). passt/slirp4netns are DELIBERATELY OMITTED: their
# egress emerges from dev's own host stack, indistinguishable from user traffic, so net_plane's per-bench
# nft rules could not key on it — benches run `--network=none` and egress is granted via net_plane's
# late-attach inject() path. fuse-overlayfs is the FALLBACK driver only (native rootless overlay is used on
# trixie's kernel); vfs is forbidden (a bind rootfs inherits the pool's noexec → container init can't exec).
Packages=
        podman
        crun
        conmon
        fuse-overlayfs
        uidmap
        catatonit
# overlay/usr/share/containers/{storage,containers}.conf: podman's native (system) config path — readable
# even though runtime /etc is sealed RO. Points rootless graphroot + image_copy_tmp_dir at the persistent
# /home bench pool (NOT volatile /var). See ExtraTrees overlay.
ExtraTrees=overlay

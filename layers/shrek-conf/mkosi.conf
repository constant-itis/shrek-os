# Shrek OS Phase-2 — the shrek-conf confext marker layer (docs/phase2-onion.md).
# A trivial /etc extension: adds /etc/shrek-layer.conf. Format=confext extends ONLY /etc and
# auto-generates /etc/extension-release.d/extension-release.shrek-conf. Built as a signed dm-verity
# DDI; keys passed on the CLI by scripts/build-layers.sh.
[Distribution]
Distribution=debian
Release=trixie

[Output]
Format=confext
ImageId=shrek-conf
Output=shrek-conf
OutputDirectory=../../out/layers
CompressOutput=no

[Content]
Packages=
ExtraTrees=overlay

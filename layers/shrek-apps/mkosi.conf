# Shrek OS — the shrek-apps sysext Onion layer (ADR-003 Part 1). Carries the everyday baseline applications
# a daily-driver needs but a sealed dm-verity /usr cannot `apt install` after the fact: file manager, image/
# PDF/media viewers, archive manager, GUI text editor, a REAL font set (the thin-font fix — DejaVu+Material
# Symbols only today, no emoji/CJK), and the everyday CLI utilities (curl/wget/git/… that live only in the
# installer/dev sysexts, never on the installed disk). Same build shape as shrek-desktop/shrek-bench: it
# INSTALLS packages into /usr, so scripts/build-apps-layer.sh builds it `--base-tree <sealed-base closure>
# --overlay` (mkosi 25.3 refuses Packages= in a sysext without a base tree). All packages are stock trixie
# main — no OBS source. The browser is DELIBERATELY NOT here — it is its own shrek-browser Onion (decision 2).
[Distribution]
Distribution=debian
Release=trixie

[Output]
# Format=sysext auto-generates /usr/lib/extension-release.d/extension-release.shrek-apps with
# ID=debian VERSION_ID=13 so it matches the sealed base at merge time (same as shrek-desktop/shrek-bench).
Format=sysext
ImageId=shrek-apps
Output=shrek-apps
OutputDirectory=../../out/layers
CompressOutput=no

[Content]
# ADR-003 Part 1 candidate manifest. Names are # VERIFY-at-build — the build resolves the exact closure and
# logs `dpkg -l` for provenance (same discipline as the base image's # VERIFY comments). Each app ships its
# own /usr/share/applications/*.desktop, surfaced by the DMS launcher + shrek-menu apps provider (#2827) —
# no launcher wiring beyond the packages. GTK4/Wayland-native where it matters (nautilus/loupe/papers/editor).
Packages=
        # File manager: GTK4, Wayland-clean, GVfs/udisks2-native trash+mount.
        nautilus
        # Image viewer: GNOME's GTK4 viewer.
        loupe
        # PDF/document viewer: GNOME's GTK4 Evince successor.
        papers
        # Media/video player: minimal deps, Wayland/GPU-accelerated, no DE pull-in.
        mpv
        # Archive manager + the backends it shells out to for the common formats.
        file-roller
        unzip
        zip
        p7zip-full
        xz-utils
        # GUI text editor: GTK4.
        gnome-text-editor
        # Fonts — the thin-font fix: a UI face, emoji (kills tofu boxes), and CJK coverage.
        fonts-noto-core
        fonts-noto-color-emoji
        fonts-noto-cjk
        fonts-liberation2
        fonts-dejavu
        # Everyday CLI utils, promoted from the installer sysext into the INSTALLED OS (they exist only in
        # the throwaway installer/dev sysexts today, never on the disk you boot — ADR-003 Context).
        curl
        wget
        git
        openssh-client
        jq
        ripgrep
        fd-find
        ca-certificates
        less
        htop
        rsync

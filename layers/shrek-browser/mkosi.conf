# Shrek OS — the shrek-browser sysext Onion layer (ADR-003 Part 1, owner decision 2). The web browser
# ships as its OWN signed dm-verity sysext, SEPARATE from shrek-apps, so it updates independently of the
# rest of the baseline app set (Firefox is the single largest closure — isolating it decouples its size
# and its update cadence from everything else). Same build shape as shrek-desktop/shrek-bench: it INSTALLS
# a package into /usr, so scripts/build-browser-layer.sh builds it `--base-tree <sealed-base closure>
# --overlay` (mkosi 25.3 refuses Packages= in a sysext without a base tree to diff against) and only the
# genuinely-new browser files land in the DDI. firefox-esr is stock trixie main — no OBS source needed.
[Distribution]
Distribution=debian
Release=trixie

[Output]
# Format=sysext auto-generates /usr/lib/extension-release.d/extension-release.shrek-browser with
# ID=debian VERSION_ID=13 so it matches the sealed base at merge time (same as shrek-desktop/shrek-bench).
Format=sysext
ImageId=shrek-browser
Output=shrek-browser
OutputDirectory=../../out/layers
CompressOutput=no

[Content]
# firefox-esr ships its own /usr/share/applications/firefox-esr.desktop, which the DMS launcher + shrek-menu
# apps provider already surface (host DesktopEntries, #2827). Wayland-native via MOZ_ENABLE_WAYLAND (set by
# the desktop session env); the GTK/graphics closure firefox links rides in this sysext as its own deps (the
# base-tree diff drops only what the sealed base already ships).
#
# ADR-007 S6a ExtraTrees: the overlay routes every browser launch into shrekbrowser.slice for the
# web-browsing cgroup egress match (Q7). It ships shrek-browser-launch/-inner (the --user --scope launcher +
# in-slice browser-up caller), a static shrekbrowser.slice user unit (WantedBy=default.target, stable cgroup
# id), and a firefox-esr.desktop override whose Exec points at the launcher (same path ⇒ overlay wins).
ExtraTrees=overlay
Packages=
        firefox-esr

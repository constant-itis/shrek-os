# Shrek OS Phase-4 — the shrek-extra sysext marker layer (docs/phase4-oniond.md).
# A SECOND trivial, SIGNED system extension used only to prove oniond's SELECTION policy (gate O2):
# it is a fully valid signed DDI on the store, but it is NOT in /usr/lib/shrek/onion-policy, so
# oniond must OMIT it (decision=omitted, reason=not-enabled) while still merging shrek-hello.
# Identical build shape to shrek-hello; keys are passed on the CLI by scripts/build-layers.sh.
[Distribution]
Distribution=debian
Release=trixie

[Output]
Format=sysext
ImageId=shrek-extra
Output=shrek-extra
OutputDirectory=../../out/layers
CompressOutput=no

[Content]
Packages=
ExtraTrees=overlay

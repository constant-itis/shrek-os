# Shrek OS — foot terminal config (Dogfood-0). Found via XDG_CONFIG_DIRS=/usr/share/shrek/xdg (set by
# the shrek-desktop launcher). login-shell=yes so each window sources /etc/profile.d (PATH to sbin,
# UTF-8 locale, the swamp prompt + aliases).
#
# S5 dynamic theming: ALL colors (incl. alpha + cursor) live in the matugen-written include below, not
# in a static [colors] block here. matugen rewrites that file from the active wallpaper on every theme
# change (see /usr/share/shrek/matugen/config.toml); the shrek-desktop launcher seeds an initial copy at
# session start so the include is never missing (foot REFUSES to start on a missing include). The
# include MUST sit in [main] — foot rejects `include` inside a [colors] section — and because there is
# no static [colors] here, nothing overrides it. shrek-foot-osc retints already-open windows live.
[main]
font=DejaVu Sans Mono:size=11
login-shell=yes
pad=10x8
include=~/.local/state/shrek/foot-colors.ini

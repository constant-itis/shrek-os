# Shrek OS — foot terminal config (Dogfood-0). Swamp palette matching the Quickshell shell tokens.
# Found via XDG_CONFIG_DIRS=/usr/share/shrek/xdg (set by the shrek-desktop launcher). login-shell=yes so
# each window sources /etc/profile.d (PATH to sbin, UTF-8 locale, the swamp prompt + aliases).
[main]
font=DejaVu Sans Mono:size=11
login-shell=yes
pad=10x8

[cursor]
color=101014 5aa02c

[colors]
alpha=0.96
background=101014
foreground=e8e8e6
regular0=17181c
regular1=e06c75
regular2=5aa02c
regular3=d8a657
regular4=4d8fbf
regular5=9a7cc0
regular6=4ea1a1
regular7=9aa0a8
bright0=2f333b
bright1=e06c75
bright2=7bbf3f
bright3=e0b968
bright4=63a8d6
bright5=b394d6
bright6=63b5b5
bright7=e8e8e6

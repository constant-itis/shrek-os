# Shrek OS — initial foot palette (swamp). The shrek-desktop launcher copies this to
# ~/.local/state/shrek/foot-colors.ini on first run so foot.ini's `include=` is never missing
# (foot refuses to start on a missing include). matugen overwrites it from the wallpaper on the
# first dynamic theme pass. Mirrors the static swamp block in foot.ini.
[colors]
alpha=0.96
background=101014
foreground=e8e8e6
selection-background=304f1a
selection-foreground=e8e8e6

regular0=17181c
regular1=e06c75
regular2=5aa02c
regular3=d8a657
regular4=4d8fbf
regular5=9a7cc0
regular6=4ea1a1
regular7=9aa0a8
bright0=2f333b
bright1=e06c75
bright2=7bbf3f
bright3=e0b968
bright4=63a8d6
bright5=b394d6
bright6=63b5b5
bright7=e8e8e6

[cursor]
color=101014 5aa02c

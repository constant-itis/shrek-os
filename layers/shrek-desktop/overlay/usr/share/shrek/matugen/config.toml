# Shrek OS — user matugen config. Seeded first-run to ~/.config/matugen/config.toml by the
# shrek-desktop launcher (matugen reads it from $XDG_CONFIG_HOME/matugen/config.toml). DMS's
# `dms matugen queue` merges this file's [config] + [templates] sections whenever it regenerates
# the palette (runUserMatugenTemplates=true in the DMS defaults). This is how non-Quickshell apps
# follow the dynamic theme; today that is foot. input_path lives in the sealed RO /usr, output on
# writable /home. post_hook retints already-open foot windows live via OSC (new windows just read
# the file). Add more [templates.*] here to theme other terminal-style apps the same way.
[config]

[templates.shrekfoot]
input_path = "/usr/share/shrek/matugen/templates/foot-colors.ini"
output_path = "~/.local/state/shrek/foot-colors.ini"
post_hook = "shrek-foot-osc"

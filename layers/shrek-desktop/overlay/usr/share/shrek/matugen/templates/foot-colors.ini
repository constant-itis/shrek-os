# Shrek OS — foot color palette, generated by matugen from the active wallpaper.
# matugen (run by `dms matugen queue` when the theme is dynamic) fills this from the
# user matugen config /usr/share/shrek/matugen/config.toml -> ~/.config/matugen/config.toml.
# foot.ini pulls it in via a top-level `include=`; this file's [colors] override the
# static swamp fallback baked into foot.ini. DMS's OWN foot template is disabled
# (matugenTemplateFoot=false) because it emits a [colors-dark] section that trixie's
# foot 1.21 rejects. Bare hex (no leading #) is the foot.ini convention.
#
# Material-3 role -> ANSI slot mapping (single-image Material palettes are tonal, so the
# 16 slots read as tints of the wallpaper rather than true ANSI hues — that is the point).
[colors]
background={{colors.surface.default.hex_stripped}}
foreground={{colors.on_surface.default.hex_stripped}}
selection-background={{colors.primary_container.default.hex_stripped}}
selection-foreground={{colors.on_primary_container.default.hex_stripped}}

regular0={{colors.surface_container_high.default.hex_stripped}}
regular1={{colors.error.default.hex_stripped}}
regular2={{colors.primary.default.hex_stripped}}
regular3={{colors.tertiary.default.hex_stripped}}
regular4={{colors.secondary.default.hex_stripped}}
regular5={{colors.primary_fixed_dim.default.hex_stripped}}
regular6={{colors.tertiary_container.default.hex_stripped}}
regular7={{colors.on_surface_variant.default.hex_stripped}}
bright0={{colors.outline.default.hex_stripped}}
bright1={{colors.error.default.hex_stripped}}
bright2={{colors.primary.default.hex_stripped}}
bright3={{colors.tertiary.default.hex_stripped}}
bright4={{colors.secondary.default.hex_stripped}}
bright5={{colors.secondary_fixed_dim.default.hex_stripped}}
bright6={{colors.tertiary_fixed.default.hex_stripped}}
bright7={{colors.on_surface.default.hex_stripped}}

[cursor]
color={{colors.surface.default.hex_stripped}} {{colors.primary.default.hex_stripped}}

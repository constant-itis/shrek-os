# Shrek OS — the shrek-desktop sysext Onion layer (Desktop Bootstrap 0, docs/desktop-bootstrap-0.md).
# Carries the Rung-2 Wayland desktop runtime (Sway + Qt6 QML + Quickshell + portals + PipeWire) as a
# signed dm-verity sysext merged onto the sealed /usr. Unlike the marker layers (shrek-hello/extra),
# this one INSTALLS packages — they land in /usr, which the sysext overlays. DMS-BOOT-0 uses packaged
# DMS plus Debian backports Quickshell; scripts/build-desktop-layer.sh supplies the temporary OBS apt
# source/keyring sandbox before mkosi invokes apt.
[Distribution]
Distribution=debian
Release=trixie

[Output]
# Format=sysext auto-generates /usr/lib/extension-release.d/extension-release.shrek-desktop with
# ID=debian VERSION_ID=13 so it matches the sealed base at merge time (same as shrek-hello).
Format=sysext
ImageId=shrek-desktop
Output=shrek-desktop
OutputDirectory=../../out/layers
CompressOutput=no

[Content]
# NOTE: this layer carries real Packages=, so scripts/build-desktop-layer.sh builds it with
# `--base-tree <sealed-base closure> --overlay` — mkosi 25.3 cannot install packages into a sysext
# without a base tree to diff against, and the overlay keeps only the new desktop files in the DDI.
# Runtime packages (trixie). Names are # VERIFY-at-build — the S2 build resolves the exact closure and
# logs `dpkg -l` for provenance (same discipline as the base image's # VERIFY comments).
# QML runtime modules Quickshell loads + the Wayland client platform + software rendering (headless/no-GPU).
Packages=
        sway
        dms=1.5.3db1
        quickshell=0.3.0-1~bpo13+1
        libseat1                # Dogfood-0 (M0): sway's seat via libseat's logind backend (no seatd —
                                #   pam_systemd's logind session owns seat0). Headless smoke never took a seat.
        xkb-data                # Dogfood-0 (M0): XKB keymap data — wlroots compiles a keymap for real input
                                #   devices in the interactive session (the headless gate ran WLR_LIBINPUT_NO_DEVICES).
        foot
        foot-terminfo           # Dogfood-0 (M1): TERM=foot terminfo so TUIs (less, nano, top) render
                                #   correctly instead of falling back to a dumb terminal.
        qt6-wayland
        libqt6widgets6          # Quickshell links libQt6Widgets.so.6 (built with the widgets module);
                                #   the dev-package smoke masked this — the runtime layer must ship it.
        qml6-module-qtquick
        qml6-module-qtquick-window
        qml6-module-qtquick-layouts
        qml6-module-qtquick-shapes
        libgl1-mesa-dri         # Mesa DRI incl. llvmpipe/swrast for Qt's software-rendered Wayland path.
                                #   EGL/GBM/GLX/GLES packages are still present when needed, but only as
                                #   dependencies of qt6-wayland/sway/libqt6gui6/libgl1-mesa-dri.
        libxcb1                 # Desktop Slice 1: Quickshell's native Sway IPC (Quickshell.I3, for
                                #   workspaces/window state) is built under src/x11 -> the X11 feature
                                #   links libxcb. No X server runs (Xwayland stays disabled); this is
                                #   dormant client linkage the i3 IPC helper needs present at runtime.
        libqt6dbus6             # Slice-1 Phase 3: the Bluetooth (BlueZ), UPower, and (Phase 4)
                                #   Notifications backends are pure Qt6 D-Bus -> Quickshell links
                                #   libQt6DBus.so.6. bluez/upower daemons themselves are separate.
        libpipewire-0.3-0       # Slice-1 Phase 3: SERVICE_PIPEWIRE links libpipewire (audio). Pulled
                                #   transitively by `pipewire` above; listed explicitly for provenance.
        dbus-user-session       # Dogfood-0 (M1): wires the PER-USER session bus (/run/user/1000/bus) via
                                #   the systemd user session — the base only carries dbus-broker's SYSTEM
                                #   bus, so without this a logged-in dev has user@1000 but no session bus,
                                #   and portals/audio (which are D-Bus activated) can't come up.
        dbus-x11                # DMS falls back to dbus-launch when no PAM/logind user session owns a bus
                                #   yet; needed by the sealed headless gate and harmless in dogfood.
        xdg-desktop-portal
        xdg-desktop-portal-wlr
        xdg-desktop-portal-gtk    # Fallback backend for non-screencast portals; wlr only implements
                                  #   screenshot/screencast, so bare Sway needs gtk for the rest.
        pipewire
        pipewire-pulse          # Dogfood-0 (M1): PulseAudio-compat socket so ordinary audio clients work
        wireplumber
        bluez                   # Dogfood-0 (M1): bluetoothd — the VM has no BT controller, so it runs
                                #   healthy with no adapter = "Bluetooth service returns functional".
        fonts-dejavu-core
        papirus-icon-theme      # Desktop Slice 1 (visual): real app icons in the launcher via
                                #   Quickshell's image://icon provider (QIcon::fromTheme -> Papirus-Dark,
                                #   selected by the baked /usr gtk settings + XDG_CONFIG_DIRS).
        wl-clipboard            # Desktop Slice 7: wl-copy/wl-paste — clipboard-history capture
                                #   (wl-paste --watch) + copy-back, invoked as ordinary CLIs from QML.
        grim                    # Desktop Slice 7: screenshot capture (wlr-screencopy; independent of
                                #   Quickshell's own SCREENCOPY build flag, which stays OFF).
        slurp                   # Desktop Slice 7: interactive region select for `grim -g "$(slurp)"`.
        libnotify-bin           # Desktop Slice 7: notify-send — screenshot-saved confirmation routed to
                                #   our own notification server (Shrek is the org.freedesktop.Notifications host).
        dconf-cli               # DMS first-run theme sync invokes `dconf`.
ExtraTrees=overlay

# Shrek OS Phase-2 — the shrek-hello sysext marker layer (docs/phase2-onion.md).
# A trivial system extension: adds /usr/bin/shrek-hello + /usr/lib/shrek/layers/hello. Built as a
# signed dm-verity DDI so systemd-sysext will merge it onto the sealed /usr under an image policy
# that requires signed verity. Verity/signing keys are passed on the CLI by scripts/build-layers.sh
# (Verity=signed / VerityKey / VerityCertificate) so this config stays key-path-agnostic.
[Distribution]
Distribution=debian
Release=trixie

[Output]
# Format=sysext builds an extension DDI and auto-generates the identity marker
# /usr/lib/extension-release.d/extension-release.shrek-hello with ID=/VERSION_ID= from the
# distribution above (ID=debian, VERSION_ID=13) so it matches the host base at merge time.
Format=sysext
ImageId=shrek-hello
Output=shrek-hello
OutputDirectory=../../out/layers
CompressOutput=no

[Content]
# Extension content ONLY — no packages; the marker tree is the ExtraTrees overlay.
Packages=
ExtraTrees=overlay

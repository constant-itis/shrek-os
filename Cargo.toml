# Shrek OS control plane — cargo workspace.
# Phase-1 scaffold: five DISABLED stub binaries. They compile and install; their systemd units
# ship disabled. The security posture is authored in docs/ BEFORE these gain any behavior
# (roadmap priority: correctness -> security -> ... -> AI features). See docs/phase1-spike.md.

[workspace]
resolver = "2"
members = [
    "crates/swampd",      # filesystem-intelligence daemon        (Phase 6+)
    "crates/agentd",      # agent identity + tier/caps resolver    (Phase 8)
    "crates/shrek-policy", # sealed compiled-in policy: tier + egress (Phase 5)
    "crates/gatekeeperd", # privileged broker; only sandbox builder (Phase 4/5)
    "crates/egressd",     # desktop-egress supervisor: bless/pin store + applier (ADR-007 S2)
    "crates/oniond",      # sysext layer policy/orchestration      (Phase 2/4)
    "crates/shrekctl",    # operator CLI
    "crates/shrek",       # user-facing CLI: `shrek run` front door       (Phase 6)
    "crates/shrek-bench-run", # exported-Bench .desktop launcher target   (ADR-003 Part 2 step 7)
    "crates/coder",       # coding-agent WORKLOAD for `shrek run` (model-driven) (Phase 6 slice-2)
    "crates/model-proxy", # broker-side authenticated egress proxy for hosted models (Phase 6 slice-3)
    "crates/claude-broker", # broker-side subscription-model provider: shells the logged-in claude CLI (Phase 6 slice-4)
    "crates/codex-broker", # broker-side 2nd subscription-model provider: shells the logged-in codex CLI under bwrap (Phase 6 slice-6)
    "crates/swamp-broker", # broker-side in-sandbox swamp-query forwarder: cont_ip→session gated (Phase 6 Swamp slice-2)
    "crates/swamp-embed-proxy", # broker-side embedding-provider proxy: LAN egress for swampd's semantic tier (Phase 6 Swamp slice-4)
    "crates/shrek-gate-probe", # spike-only sealed closed-world in-sandbox acceptance probe (P5/B1)
]

# The sealed appliance image builds ONLY these (default `cargo build`/STAGE 1). model-proxy,
# claude-broker, codex-broker, swamp-broker AND swamp-embed-proxy are deliberately EXCLUDED: all are
# BROKER-SIDE components (not sealed into the image). model-proxy carries the one TLS dependency tree
# (rustls); claude-broker shells the host's `claude` CLI, codex-broker shells the host's `codex` CLI
# under `bwrap` (broker-side host dependencies, never in the sealed rootfs); swamp-broker forwards
# in-sandbox queries to swampd's host socket, gated on gatekeeperd's cont_ip→session binding; and
# swamp-embed-proxy is the semantic tier's LAN egress (swampd stays network-free, reaching it over a
# local socket — slice-4 §1.2/§1.3). Keeping them out of the default set means the appliance build pulls
# no TLS stack, no CLI/broker coupling, and no HTTP/embedding egress. Build/test them explicitly with
# `-p model-proxy` / `-p claude-broker` / `-p codex-broker` / `-p swamp-broker` / `-p swamp-embed-proxy`.
default-members = [
    "crates/swampd",
    "crates/agentd",
    "crates/shrek-policy",
    "crates/gatekeeperd",
    "crates/egressd",
    "crates/oniond",
    "crates/shrekctl",
    "crates/shrek",
    "crates/shrek-bench-run",
    "crates/coder",
    "crates/shrek-gate-probe",
]

[workspace.package]
version = "0.0.1"
edition = "2021"

# Small, sealed release binaries for the image. No dependencies by design (minimal-deps).
[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"

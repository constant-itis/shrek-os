[package]
name = "model-proxy"
version.workspace = true
edition.workspace = true

# The broker-side AUTHENTICATED EGRESS PROXY (security-model.md §7) for the coder's hosted-model
# (Anthropic) provider — docs/phase6-slice3-provider-abstraction.md.
#
# It is NOT a control plane and is NOT sealed into the appliance image. It runs BROKER-SIDE, outside
# the T2 sandbox: it holds the API key, injects auth, and terminates TLS to Anthropic, so the sandboxed
# coder never holds the secret and never reaches Anthropic directly (the lethal-trifecta break). The box
# speaks PLAINTEXT to this proxy over the sealed one-destination `model-anthropic` egress; only this
# process speaks TLS out.
#
# This is the ONE crate permitted a TLS dependency tree (rustls, pure-Rust, no OpenSSL — the fork-#2
# preference). It is scoped HERE only and vendored in-tree for an auditable, offline build; the sealed
# planes stay dep-free and the sandboxed coder keeps its single tinyjson dep. model-proxy is excluded
# from the sealed image's default build (workspace default-members) so the appliance build pulls no TLS
# stack. A musl-static or self-contained single-binary variant is a later hardening (like the coder's).
[dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"
rustls-pki-types = "1"
rustls-pemfile = "2"

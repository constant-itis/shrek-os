[package]
name = "egressd"
version.workspace = true
edition.workspace = true

[dependencies]
shrek-policy = { path = "../shrek-policy" }
# The sealed DoT re-pin client (ADR-007 S2c) now lives in the SHARED shrek-dot crate (ADR-008 S4), so
# gatekeeperd resolves its privileged public-egress pins over the same sealed transport. egressd keeps
# only the desktop-profile→Pin wrappers on top of it (src/dot.rs). rustls (the one TLS tree) rides in.
shrek-dot = { path = "../shrek-dot" }

[features]
# `oracle-env` gates the `SHREK_EGRESS_*` path overrides (store dir, /run projection dir) to the
# host/container oracle ONLY. It is DEFAULT-OFF: the shipped sealed image compiles them out, so the
# root supervisor ALWAYS uses the sealed defaults (`/home/.shrek-system/egress`, `/run/shrek/egress`)
# and no environment crossing the sudo boundary can redirect the bless/pin store at a uid-1000-writable
# dir. The host oracle (S2e, no systemd/VM) opts in with `--features oracle-env`. Mirrors gatekeeperd's
# `oracle-env` (bench_record.rs) discipline. Core store fns take an explicit `&Path`, so `cargo test`
# never touches the real store regardless of this feature. Passes through to shrek-dot so the sealed-CA
# override (SHREK_DOT_CA / SHREK_EGRESS_DOT_CA) is honored in the host oracle only.
oracle-env = ["shrek-dot/oracle-env"]

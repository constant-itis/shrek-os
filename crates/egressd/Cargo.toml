[package]
name = "egressd"
version.workspace = true
edition.workspace = true

[dependencies]
shrek-policy = { path = "../shrek-policy" }
# The sealed DoT re-pin client (ADR-007 S2c). rustls is the ONE TLS tree the sealed image carries — the
# owner's decision to bake the DoT resolver into the supervisor rather than trust resolved/NM/getaddrinfo
# ([R1-MF1]/[R2-MF-C], #3121's workaround). Pure-Rust (ring, no OpenSSL), default-features off so no
# webpki-roots / host CA store is pulled: the trust base is ONLY the sealed dot-ca-roots.pem, loaded via
# rustls-pemfile. Same rustls 0.23 line already vendored for broker-side model-proxy.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
rustls-pemfile = "2"

[features]
# `oracle-env` gates the `SHREK_EGRESS_*` path overrides (store dir, /run projection dir) to the
# host/container oracle ONLY. It is DEFAULT-OFF: the shipped sealed image compiles them out, so the
# root supervisor ALWAYS uses the sealed defaults (`/home/.shrek-system/egress`, `/run/shrek/egress`)
# and no environment crossing the sudo boundary can redirect the bless/pin store at a uid-1000-writable
# dir. The host oracle (S2e, no systemd/VM) opts in with `--features oracle-env`. Mirrors gatekeeperd's
# `oracle-env` (bench_record.rs) discipline. Core store fns take an explicit `&Path`, so `cargo test`
# never touches the real store regardless of this feature.
oracle-env = []

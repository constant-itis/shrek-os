# Dogfood-0 (M1) — create the dev user's home on the persistent shrek-data disk.
#
# home.mount mounts the (initially empty) shrek-data ext4 at /home before local-fs.target; this rule
# then creates /home/dev owned by dev (uid/gid 1000, baked in /etc/passwd) on the FIRST boot. On later
# boots the directory already exists on the persistent disk, so this is a no-op — user files survive
# reboot. systemd-tmpfiles-setup runs After=local-fs.target (i.e. after home.mount), Before=sysinit,
# so /home/dev exists before the tty1 dev autologin session starts.
d /home/dev 0700 dev dev -
d /home/.shrek-system 0700 root root -
d /home/.shrek-system/NetworkManager 0700 root root -
d /home/.shrek-system/NetworkManager/system-connections 0700 root root -
# ADR-005 provisioning store (root:root 0700 — non-secret intent, but no reason to expose it). The gate
# validates $STORE/manifest (transplanted by the installer, or DOGFOOD-seeded from the test-manifest); the
# domain appliers materialize bind SOURCES under state/ and record seed-once decisions under .applied/. The
# gate's ephemeral /run output dir is created by the gate itself, so it needs no tmpfiles entry.
d /home/.shrek-system/provisioning 0700 root root -
d /home/.shrek-system/provisioning/state 0700 root root -
d /home/.shrek-system/provisioning/.applied 0700 root root -

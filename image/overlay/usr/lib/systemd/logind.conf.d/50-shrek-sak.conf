# Shrek OS — bench-authz consent slice. The console consent ceremony's trust trigger is systemd 257's
# SecureAttentionKey (Ctrl+Alt+Shift+Esc): logind reads seat evdev directly (compositor-independent) and
# emits the org.freedesktop.login1.Manager SecureAttentionKey signal that gatekeeperd's arm_sak subscribes
# to with a sender-pinned match. The stock image ships this at logind's COMPILED DEFAULT (the line is
# commented in /etc/systemd/logind.conf), so the trigger would silently break if that default ever changed.
# Pin it explicitly here — a vendor drop-in in the verity /usr, since the runtime /etc is sealed read-only.
[Login]
HandleSecureAttentionKey=secure-attention-key

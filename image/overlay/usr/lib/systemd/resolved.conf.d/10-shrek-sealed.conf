# Shrek OS — ADR-007 S2c/S2d: harden systemd-resolved as DEFENSE IN DEPTH.
#
# egressd's correctness does NOT depend on this (S2c proves the DoT re-pin bypasses resolved/NM/NSS
# entirely — it dials sealed resolver IPs and validates against the sealed root bundle). This drop-in
# shrinks resolved's own attack surface so a uid-1000-steerable input cannot ride resolved for OTHER
# consumers:
#   ReadEtcHosts=no  — resolved does not consult /etc/hosts. As of ADR-008 (#3121 FIXED) /etc/hosts is
#                      ROOT-authored (a symlink to root-composed /run/shrek/hosts), so this is no longer a
#                      uid-1000 vector — it is now pure defense-in-depth (resolved simply never needs the
#                      host table; nsswitch `files` still serves getaddrinfo from the root-owned file).
#   LLMNR=no         — no link-local multicast name resolution (unauthenticated LAN spoofing surface).
#   MulticastDNS=no  — no mDNS resolution for the same reason.
#
# Shipped in the sealed overlay unconditionally: it only tightens resolved and is harmless on every
# variant.
[Resolve]
ReadEtcHosts=no
LLMNR=no
MulticastDNS=no

# Shrek OS — ADR-007 S5: seal the system clock source to desktop-ntp's LITERAL IPs.
#
# This drop-in is the ACTUAL enforcement for the NTP baseline. The nft floor drops uid 1000 only;
# timesyncd runs under its own system uid, so nft does NOT constrain it — this config does. It pins
# timesyncd to the two Cloudflare `time.cloudflare.com` anycast IPs (Q6a), byte-for-byte the same
# literals as `DESKTOP_NTP` in shrek-policy and the baked `@ntp_pinned` nft set. All three must agree;
# scripts/desktop-ntp-proof.sh asserts they do.
#
#   NTP=          — the two SEALED LITERAL IPs [R2-MF-C]. NO hostname → ZERO name resolution at boot.
#                   That is the whole point: DoT needs a sane clock, a sane clock needs NTP, and NTP
#                   here needs no DNS — so it breaks the DoT<->clock cycle (ADR §5). Clock-good then
#                   lets the supervisor's sealed-DoT re-pin of weather/updates succeed.
#   FallbackNTP=  — EMPTIED. timesyncd ships a compiled-in fallback pool of *hostnames* (ntp.org). Left
#                   at its default, a sealed-IP failure would silently fall back to resolving those
#                   names = unsealed egress under timesyncd's uid, defeating the pin. Empty = timesyncd
#                   talks to the two sealed IPs or nothing. Fail-closed, no name ever.
#
# SNTP has no NTS and no cert to verify a name against, so pinning the IP loses nothing a name would
# have given us; the sealed IP only narrows which host may answer, which is all a clock warrants (§5).
# Shipped in the sealed overlay unconditionally, mirroring resolved.conf.d/10-shrek-sealed.conf.
[Time]
NTP=162.159.200.1 162.159.200.123
FallbackNTP=

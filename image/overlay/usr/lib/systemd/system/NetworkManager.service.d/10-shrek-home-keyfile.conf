# Shrek OS — Sprint S2 (network persistence). Debian's NetworkManager.service ships
# ProtectHome=read-only, which mounts /home read-only inside the daemon's namespace —
# so NetworkManager cannot write there even though it runs as root. The sealed image
# has a read-only /etc, so NM's keyfile store is redirected to /home
# (20-shrek-persistent-keyfile.conf → /home/.shrek-system/NetworkManager/system-connections).
# Without relaxing the sandbox, saving a system connection silently no-ops (the profile is
# accepted over D-Bus but never lands on disk) and Wi-Fi credentials never persist across a reboot.
#
# ReadWritePaths= takes precedence over ProtectHome=, so this punches a writable hole for JUST
# the keyfile store while the rest of /home stays read-only to NM. The store dir is pre-created by
# tmpfiles (shrek-home.conf) before NM starts; the leading '-' keeps the unit from failing to start
# on the rare boot where it is not yet present.
[Service]
ReadWritePaths=-/home/.shrek-system/NetworkManager

# Shrek OS — §5b clobber closure guard (i), getty side. SOURCE (tracked, shipped unconditionally).
#
# Re-assert the provisioned VT keymap (ckbcomp "$XKBLAYOUT" | loadkeys -, via shrek-provision-kick) as the
# LAST keymap write before the tty1 login/session spawns. On our image the keymap clobber is
# console-setup.service re-applying the baked `us` from /etc/default/keyboard (systemd-vconsole-setup is
# absent — see the ADR-005 §5b correction); this re-assert is behavior-independent — it does not depend on
# stopping that clobber, it simply writes the intended layout last. Unlike the owner-provision drop-in this
# is NOT variant-gated: it is a hard no-op when XKBLAYOUT is `us` (unprovisioned / plain-CI / LIVE_INSTALLER)
# and reads whatever /etc/vconsole.conf currently holds (the keymap applier's bind, if provisioning is on).
#
# `-` prefix keeps it fail-open: a keymap kick must never block the autologin (contrast the owner-provision
# drop-in, whose Requires= is deliberately fail-CLOSED on the credential itself, not on the keymap).
[Service]
ExecStartPre=-/usr/bin/env SHREK_KICK_DOMAIN=keymap /usr/lib/shrek/shrek-provision-kick

# Dogfood-0 (M1) — autologin the non-root `dev` user on tty1 (replaces the M0 root autologin).
#
# agetty --autologin execs `login -f dev`, which skips authentication (dev's password is locked,
# passwd -l shape, in the sealed /etc). pam_systemd then registers dev's session on seat0, granting it
# the DRM/input uaccess ACLs sway needs — so sway (and Quickshell) run as an ordinary user, not root.
# Only tty1 is overridden; serial-getty@ttyS0 keeps the normal login prompt (the headless CI proofs
# read the console, they never log in). dev's login shell sources /etc/profile.d/zz-shrek-desktop.sh,
# which execs shrek-desktop only when /dev/dri/card0 exists (the graphical dogfood VM).
# Order the autologin after the login-readiness barrier: shrek-desktop-ready.service does not return
# until the boot-time sysext(/usr)+confext(/etc) merge is verifiably settled (login binary + libs + PAM
# config + the merged shrek-desktop binary all resolvable). Starting getty→login before that races the
# still-settling overlay and intermittently fails PAM ("Authentication failure"). getty@.service is
# already After=systemd-user-sessions.service (so /run/nologin is gone); this adds the merge-settle gate.
[Unit]
After=shrek-desktop-ready.service
Wants=shrek-desktop-ready.service

[Service]
ExecStart=
ExecStart=-/sbin/agetty --autologin dev --noclear %I $TERM

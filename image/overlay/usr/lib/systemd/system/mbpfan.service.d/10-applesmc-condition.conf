# Shrek ships ONE universal image; mbpfan is only meaningful on Apple-SMC hardware. Gate the unit on the
# applesmc platform device so on non-Apple machines (and the headless VM acceptance gate) it is cleanly
# SKIPPED (condition false) instead of failing to start — keeps `systemctl is-active` gates green while
# still protecting a real Mac from cooking. # VERIFY-at-build: applesmc must be loaded by the time the
# unit is evaluated on a Mac (DMI autoload); if not, add a modules-load.d entry.
[Unit]
ConditionPathExistsGlob=/sys/devices/platform/applesmc.*

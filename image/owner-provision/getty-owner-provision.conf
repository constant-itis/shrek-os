# Shrek OS — owner-provisioning login gate (#2939). SOURCE TEMPLATE.
#
# build-in-container.sh installs this as a getty@tty1 drop-in
# (image/overlay/etc/systemd/system/getty@tty1.service.d/50-owner-provision.conf) ONLY for the
# INSTALLABLE product and the DOGFOOD proof — the two variants that provision an owner credential. The
# generated copy is gitignored; LIVE_INSTALLER and plain-CI never get it (their `dev` keeps the public
# `shrek` password, which is correct: the live installer has no owner account yet, and plain-CI has no
# writable /home to provision onto).
#
# Requires= (not Wants=) makes this FAIL-CLOSED: if shrek-owner-provision.service fails — a rejected seed,
# a failed bind-mount of the owner shadow over /etc/shadow — getty@tty1 refuses to start, so the desktop
# never comes up guarded only by the public `shrek` credential. After= sequences the wizard (which owns
# tty1) strictly before the autologin.
[Unit]
Requires=shrek-owner-provision.service
After=shrek-owner-provision.service

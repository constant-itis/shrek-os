# Shrek OS Phase-1 — SPIKE / VM-ACCEPTANCE ONLY. REMOVE before any real/shipped image.
# Adds console=ttyS0 so a headless KVM boot (scripts/boot-vm.sh) emits kernel + systemd output on the
# serial port, letting us verify the sealed+signed boot (Secure Boot state, dm-verity root mount,
# reached target). The cmdline is sealed inside the signed UKI, so this must be baked at build time —
# Secure Boot forbids appending kernel args at boot. A serial console is an attack surface the threat
# model accounts for; this drop-in keeps it isolated and obvious so it is trivially gated/removed.
[Content]
KernelCommandLine=console=ttyS0

# Shrek OS Phase-1 — S5: sign systemd-boot + the UKI for UEFI Secure Boot.
# SecureBoot=yes makes mkosi sbsign both the bootloader and every generated UKI, so the signature
# authenticates the UKI's .cmdline (which carries the S4 roothash) — the roothash becomes trusted
# once the Shrek key is enrolled (S6, via MOK).
# The signing key/cert are a THROWAWAY spike key generated into keys/ (gitignored, never shipped);
# their paths are supplied by scripts/build-in-container.sh via --secure-boot-key/-certificate so
# this declarative config stays independent of the build harness's mount layout.
# SecureBootSignTool=sbsign: systemd-sbsign is absent on trixie, so pin sbsign rather than let
# `auto` probe (sbsigntool is installed in the build container).
[Validation]
SecureBoot=yes
SecureBootSignTool=sbsign
# S6: stage the Shrek key as db/KEK/PK .auth files under the ESP (/loader/keys/auto/). systemd-boot
# enrolls them when the VM firmware is in SETUP MODE, then reboots into enforcing Secure Boot — the
# no-shim equivalent of MOK for a self-signed chain. systemd-boot only auto-enrolls in VMs (v253+;
# trixie = 257). This is a spike/VM convenience; a distributed image would ship keys differently.
SecureBootAutoEnroll=yes

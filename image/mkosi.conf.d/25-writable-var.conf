# Shrek OS Phase-1 — S7: give the sealed image a writable /var.
# The root is a read-only dm-verity partition, so stateful services (systemd-logind,
# systemd-networkd-persistent-storage) had nowhere to write /var and restart-looped at S6.
# `systemd.volatile=state` mounts /var as a fresh tmpfs each boot — the minimal fix that unblocks
# those services without a separate writable partition (which would need a machine-id-embedded UUID).
# This is the spike form of the "writable /var over sealed /usr" model (docs/phase1-s7-sysupdate.md);
# a persistent /var partition (or the full sealed-/usr + writable-/ layout) is the later refinement.
# mkosi appends KernelCommandLine across drop-ins; this is sealed into the signed UKI at build.
[Content]
KernelCommandLine=systemd.volatile=state

# Shrek OS Phase-1 — real-hardware USB-boot support (initrd USB storage stack).
#
# THE BUG (proven on the physical 2012 MacBookPro9,2, booted via rEFInd): the kernel starts and the
# console works, but the boot drops to emergency mode — dev-disk-by-partuuid-<data>.device times out,
# veritysetup@root fails, sysroot.mount fails. The dm-verity root partition never appears because the
# USB stick never becomes a block device once Linux takes over its own USB stack.
#
# ROOT CAUSE: mkosi assembles the UKI initrd as a module-less base initrd plus an appended per-kernel
# "kernel modules initrd" (KernelModulesInitrd=, on by default). ALL kernel modules live in that appended
# initrd — the base carries none. Its default module selection includes dm-verity + virtio (so VMs boot)
# but NOT the USB host controllers (xhci/ehci/ohci/uhci), the USB->SCSI translation (usb-storage, uas), or
# the SCSI disk layer (sd_mod, scsi_mod). So on real hardware the USB controller enumerates the device but
# nothing exposes it as /dev/sdX, the by-partuuid root device never appears, and boot lands in emergency.
# This bites ANY real-hardware boot off USB, not just the Mac.
#
# THE FIX: pin the appended kernel-modules initrd to an explicit, minimal set = mkosi's `default` module
# list (the essentials that make VMs boot — dm-verity/dm-mod/ext4/erofs/virtio_*/nvme/ahci/vfat/overlay,
# plus usb-storage/sd_mod/scsi_mod which already live there) PLUS the USB host + storage stack the default
# list omits. Exclude=.* keeps everything else out so the initrd stays small; Include takes priority over
# Exclude, and mkosi resolves module dependencies (so usbcore/usb-common/scsi are pulled in). The `default`
# keyword is LOAD-BEARING: dropping it (Include=<usb only>) strips dm-verity/virtio from the initrd and the
# dm-verity root fails to assemble even in a VM. Verified against the trixie 6.12.x-amd64 module tree.
#
# PRE-DEPLOY GATE: before writing any physical stick, run scripts/initrd-usb-check.py on the built UKI —
# it decodes ALL concatenated zstd frames of the .initrd and confirms the USB stack (usb-storage/sd_mod/
# uas/xhci/ehci) is present (exit 0 = safe to flash; scripts/initrd-frames.py gives the per-frame
# boot-crit/usb breakdown). Do NOT hand-roll this: a single-frame decode stops after the module-less base
# frame and reports EVERYTHING missing (dm-verity included) — a nonsense result to distrust, not act on.
# Also boot the sealed image in the VM oracle (scripts/boot-vm.sh); a regression here silently reproduces
# the emergency-mode boot on real hardware (the VM boots via virtio, so it cannot catch a USB-stack gap).
[Content]
KernelModulesInitrd=yes
KernelModulesInitrdInclude=default,/usb-storage.ko,/uas.ko,/xhci-hcd.ko,/xhci-pci.ko,/ehci-hcd.ko,/ehci-pci.ko,/ohci-hcd.ko,/ohci-pci.ko,/uhci-hcd.ko,/sd_mod.ko,/scsi_mod.ko,/usbcore.ko,/usb-common.ko
KernelModulesInitrdExclude=.*

# Shrek OS Phase-1 — real-hardware console visibility.
#
# The sealed UKI cmdline previously carried only `console=ttyS0` (90-vm-acceptance.conf), a SERIAL-only
# console. On real hardware with no serial port (e.g. the 2012 MacBook) that means the screen stays blank
# through the whole boot — the machine looks frozen even when the kernel is running. Add `console=tty0` so
# kernel messages also render on the physical display.
#
# ORDERING MATTERS — this drop-in sorts BEFORE 90-vm-acceptance.conf, so the sealed cmdline ends up
# `... console=tty0 console=ttyS0`. The kernel writes printk to ALL registered consoles (so tty0 shows
# boot output on the Mac panel), while the LAST console= — ttyS0 — remains /dev/console. Keeping ttyS0 as
# /dev/console is deliberate: the headless VM acceptance oracles read the dogfood/gate output off the
# serial log (services run StandardOutput=…console → ttyS0 → out/*.log), so flipping the primary console
# to tty0 would silence those gates. Real-hardware emergency-shell diagnostics instead use a dedicated
# rEFInd debug entry that puts console=tty0 last (see the hardware-boot runbook), so the sealed image
# only needs tty0 present as an additional console, not as the primary.
#
# Like the other cmdline drop-ins this is sealed into the signed UKI at build time (Secure Boot forbids
# appending kernel args at boot), and mkosi appends KernelCommandLine across drop-ins in filename order.
[Content]
KernelCommandLine=console=tty0

# Shrek OS Phase-1 — S3 hardening drop-in (docs/phase1-spike.md). Coder-drafted, reviewed.
# VERIFY at S2 build: each cmdline token depends on kernel config (CONFIG_APPARMOR,
# CONFIG_SECURITY_LOCKDOWN_LSM, CONFIG_RANDOMIZE_KSTACK_OFFSET, …). mkosi appends KernelCommandLine
# across drop-ins.
#
# LSM stack: Phase-5 slice-4's T0 constructor depends on Landlock being ACTIVE at boot. The legacy
# `security=apparmor` selector is replaced by an explicit `lsm=` list (the modern stacked-LSM control
# — it overrides both CONFIG_LSM and `security=`), so Landlock is deterministically enabled alongside
# apparmor + lockdown rather than left to the distro default. `capability` is always first implicitly.
# Order mirrors the Debian kernel's CONFIG_LSM default; `apparmor=1`/`lockdown=integrity` still tune
# those two. If Landlock were disabled at boot, gatekeeperd's preflight would fail up to T1 (safe) —
# the sealed-VM S4 gate asserts genuine T0, so a regression here surfaces as a gate FAIL, not silently.

[Content]
KernelCommandLine=apparmor=1 lsm=landlock,lockdown,yama,integrity,apparmor,bpf lockdown=integrity vsyscall=none slab_nomerge init_on_alloc=1 init_on_free=1 page_alloc.shuffle=1 randomize_kstack_offset=1

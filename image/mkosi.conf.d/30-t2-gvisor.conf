# Shrek OS Phase-5 slice-6 — seal the T2 (gVisor/runsc) constructor's runtime artifacts into the
# dm-verity /usr. gatekeeperd's t2_plane reads compiled-in PROD defaults /usr/lib/shrek/{runsc,
# t2-rootfs} (crates/gatekeeperd/src/t2_plane.rs); this ExtraTree places them there so they inherit the
# sealed, read-only, roothash-authenticated /usr — the constructor gains NO writable authority source.
#
# The tree is assembled at build time by scripts/seal-t2-artifacts.sh (STAGE 2 of
# build-in-container.sh): fetch + sha256-verify the pinned runsc from image/supply/gvisor.pin — NEVER
# the 'latest' channel — and build the minimal busybox-static rootfs. image/mkosi.extra.t2/ is a
# ~100 MB build artifact, not source, so it is gitignored (like out/ and keys/).
#
# mkosi merges ExtraTrees across drop-ins, so this stacks on the base `overlay` tree (mkosi.conf)
# without disturbing it; the two write disjoint files under /usr/lib/shrek.
[Content]
ExtraTrees=mkosi.extra.t2

# Shrek OS Phase-1 base image (skeleton) — see ../docs/phase1-spike.md.
# Drafted by the local coder tier, reviewed on the primary model. Built inside a debian:trixie
# container (scripts/build-in-container.sh); the beepboop host stays untouched.
# NOTE: mkosi config is version-sensitive — every `# VERIFY` is validated at the S2 build, not here.

[Distribution]
Distribution=debian
Release=trixie
# non-free-firmware carries intel-microcode/amd64-microcode + the firmware-* device blobs bundled below
# (hardware-enablement group in Packages=). main is the default; listed explicitly so the component set
# is self-documenting. # VERIFY-at-build: mkosi 25.3 maps Repositories= to the apt components and the
# in-container Debian mirror must serve non-free-firmware (it does on deb.debian.org).
Repositories=main,non-free-firmware

[Output]
Format=disk
# S7: versioned output. ImageId MUST precede Output= — mkosi expands the %i specifier only from
# settings parsed *earlier* in the section, so `Output=%i_…` with ImageId below it silently yields an
# empty %i (verified via `mkosi summary`). Order matches particleos. Output=%i_%v_%a →
# shrek_<version>_x86-64.raw, and the split artifacts inherit the version so systemd-sysupdate's @v
# wildcard matches them (docs/phase1-s7-sysupdate.md). Version comes from image/mkosi.version (the
# harness writes 1 or 2). SplitArtifacts copies the root/verity partitions + signed UKI out as the
# standalone files the sysupdate [Source] installs into the inactive slot.
ImageId=shrek
Output=%i_%v_%a
CompressOutput=no
OutputDirectory=../out
SplitArtifacts=partitions,uki

[Content]
Bootable=yes
Bootloader=systemd-boot
UnifiedKernelImages=yes          # VERIFY: key name on target mkosi (>= v24)
# S7: name the UKI with the version so both A/B UKIs coexist in the ESP and systemd-boot boots the
# newest; sysupdate's boot-counting appends +@l-@d to this stem (docs/phase1-s7-sysupdate.md).
UnifiedKernelImageFormat=%i_%v_%a
Locale=C.UTF-8

# Root account: NO password is baked into the base image (locked by default).
# Dogfood-0 (M1): root autologin is REPLACED by a non-root `dev` autologin on tty1. mkosi's
# `Autologin=yes` would autologin ROOT on every getty (tty1 + serial); instead a baked getty@tty1
# drop-in (image/overlay/usr/lib/systemd/system/getty@tty1.service.d/autologin.conf) runs
# `agetty --autologin dev`, and getty@tty1 is force-enabled (getty.target.wants) so it starts at
# multi-user. pam_systemd (libpam-systemd, below) then registers dev's logind session on seat0 — the
# seat sway's libseat→logind backend needs for the DRM device ACLs. The interactive desktop is still
# started from /etc/profile.d/zz-shrek-desktop.sh (unchanged; guarded on /dev/dri/card0 so it fires
# only on the graphical dogfood VM, never the headless CI serial gate). The serial getty stays a normal
# login prompt (the CI proofs read SHREK_GATE off the console, not a login), so they are unaffected.

# S4 (DONE): dm-verity sealing is wired via mkosi.repart/ (00-esp, 10-root Verity=data,
#            20-root-verity Verity=hash). systemd-repart builds the sealed root + hash tree; mkosi
#            injects roothash= into the UKI cmdline. Unsigned verity — authenticated by the UKI sig at S5.
# TODO(S5): UKI signed with the Shrek key (SecureBoot* / --secure-boot-* keys) attaches here.
# S7 (in progress): A/B update is systemd-sysupdate, NOT bootc — bootc/composefs are unpackaged on
#            Debian (docs/phase1-s7-sysupdate.md). Disk gets A/B root+verity slots + a writable /var;
#            image/mkosi.sysupdate/ holds the transfer defs. systemd-sysupdate ships in systemd-container.

Packages=
        systemd
        systemd-boot
        systemd-boot-efi        # provides /usr/lib/systemd/boot/efi/linuxx64.efi.stub — required to build the UKI
        systemd-container       # S7: Debian ships /usr/lib/systemd/systemd-sysupdate here (the A/B update engine)
        libcryptsetup12         # Phase 2: systemd dlopens libcryptsetup.so.12 to set up dm-verity for signed
                                #          sysext/confext layers at merge time — without it `systemd-sysext merge`
                                #          fails "libcryptsetup.so.12 is not installed" (verified in-container).
        network-manager         # Desktop/laptop host connectivity backend: Wi-Fi, roaming, VPN, docks, metered.
        udisks2                 # Sprint S4 (storage): removable/attached-disk mounting backend for the DMS
                                #   file manager. Base (not a layer): it carries an /etc footprint (udisks2.conf)
                                #   and a D-Bus-activated service, both integrated natively at base build — no
                                #   sysext post-merge dance. Mounts to /run/media (volatile). The active seat0
                                #   user gets the *-system mount actions via a baked polkit rule (see postinst).
        brightnessctl           # Sprint S6 (brightness): backend for the DMS brightness keys (XF86MonBrightness*
                                #   -> `dms ipc call brightness`). Writes /sys/class/backlight via its `video`-group
                                #   udev rule (dev is added to video in postinst). No backlight node exists in the
                                #   VM, so it is inert there — it matters on the real Mac panel.
        power-profiles-daemon   # Sprint S6 (power-profiles): backs the DMS bar power-profile widget (Performance /
                                #   Balanced / Power Saver). D-Bus activated like udisks2 (no enable needed); the
                                #   active seat0 session gets switch-profile via a baked polkit rule (see postinst).
        systemd-resolved
        udev
        dbus-broker
        libpam-systemd          # Dogfood-0 (M0): pam_systemd — the autologin PAM session registers with
                                #   logind (seat0 + XDG_RUNTIME_DIR), which grants the active session the
                                #   DRM/input device ACLs sway's libseat(logind) backend needs.
        login                   # Dogfood-0 (M0): /bin/login — agetty --autologin execs it (PAM entry point).
                                #   Sprint S3: also the PAM service (/etc/pam.d/login) the DMS lock screen
                                #   authenticates dev against (lockPamExternallyManaged), via pam_unix.
        pamtester               # Sprint S3 (lock): the dogfood probe uses it to prove the lock's PAM auth
                                #   path end-to-end (dev+password -> /etc/pam.d/login -> SUCCESS; wrong -> fail).
                                #   Tiny, and a legitimate diagnostic to ship.
        sudo                    # Dogfood-0 (M1): NOPASSWD sudo for the dev user (sudoers.d/dev-nopasswd),
                                #   so admin work in the dogfood box needs no password — independent of dev's
                                #   own login password (UNLOCKED as of S3 so the lock screen can authenticate).
        linux-image-amd64
        ca-certificates
        apparmor
        apparmor-utils
        less
        # Dogfood-0 (M1): a usable interactive dev shell — clear/tput/reset (ncurses-bin), ps/top/free
        # (procps), an editor (nano), tab-completion, and file(1). Small, high value for a box you sit at.
        ncurses-bin
        procps
        nano
        bash-completion
        file
        iproute2                # Phase-5 slice-3: `ip` — the egress plane's netns/veth plumbing
        nftables                # Phase-5 slice-3: `nft` — the per-sandbox egress allow-list/masquerade
        e2fsprogs               # Phase-5 slice-8 (S6 VM gate ONLY, spike): `mkfs.ext4 -O verity` to
                                #          provision the dedicated runtime fs-verity fs the positive-pin
                                #          gate measures against. Strip with the gate scaffolding.

        # ── Hardware enablement (real-metal daily-driver) — see mycelium #2905 ─────────────────────
        # Shrek is an IMMUTABLE sealed image: a missing driver/daemon/firmware is NOT a user apt-install,
        # it needs a full rebuild the user cannot do. So we BUNDLE what the target hardware CLASSES need to
        # be functional out of the box (radios, firmware, thermal, time, power) — the Silverblue/SteamOS
        # model — instead of shipping minimal and stranding the user. mkosi installs --no-install-recommends,
        # so these (Recommends of network-manager/systemd) must be listed EXPLICITLY. That omission is why
        # wifi was dead on the Mac: the BCM4331 b43 chip worked but wpa_supplicant (a NM Recommends) was
        # never pulled.
        wpasupplicant           # Wi-Fi userspace: NetworkManager's WPA/WPA2/WPA3 supplicant. WITHOUT it NM
                                #   reports every wifi device "unavailable" (the exact Mac bug: b43 bound +
                                #   firmware loaded, empty scan). Hard requirement for any wifi at all.
        wireless-regdb          # Regulatory-domain DB: lets the card use its region's legal channels/TX-power
                                #   instead of the conservative world default (ch 12/13 off, low power). The
                                #   "wifi connects but is weirdly weak/short-range" fix.
        iw                      # cfg80211 CLI (iw dev/scan/reg get) — wifi diagnostics on real metal. Small.
        rfkill                  # soft/hard radio-block query + toggle. Was only in the installer layer; a
                                #   blocked radio looks identical to a missing driver without it.
        bluez                   # bluetoothd — MOVED here from the desktop layer. It MUST be in BASE so it is
                                #   present when systemd computes the boot transaction; its enable symlink in
                                #   the late-merging desktop sysext was ignored → bluetooth dead at boot (#2904,
                                #   same class as the polkit #2795 bug). Base pkg + a BASE enable symlink
                                #   (overlay multi-user.target.wants/bluetooth.service) mirrors NetworkManager.
        upower                  # Battery/AC daemon — backs the DMS battery widget + low-battery warnings on
                                #   laptops. D-Bus activated (org.freedesktop.UPower), no enable needed (like
                                #   udisks2). In BASE (not the layer) so its D-Bus activation file is visible
                                #   from boot.
        systemd-timesyncd       # SNTP client (split from systemd on trixie, so not pulled by `systemd`). A
                                #   sealed TLS-everything OS with a 2012 RTC needs NTP or certs fail with
                                #   clock-skew errors that look like random breakage. Enabled via overlay symlink.
        mbpfan                  # Fan control for Apple-SMC (applesmc) machines — THE thermal-safety item: 2012
                                #   Macs under Linux run the stock SMC fan curve too lazily and an Ivy Bridge
                                #   cooks under sustained load (e.g. in-box cargo builds). Condition-guarded to
                                #   applesmc via an overlay drop-in so it is INERT on non-Apple HW + the VM gate.
        intel-microcode         # Early CPU microcode (Intel) — errata/security fixes loaded before userspace.
        amd64-microcode         #   …and AMD, so ONE universal image is safe on both. (non-free-firmware.)
                                #   Delivered as an early cpio prepended to the initrd — # VERIFY-at-build that
                                #   BOTH the UKI and the rEFInd loose-initrd path actually carry the ucode frame.
        # Broad device firmware so Shrek lights up on OTHER x86-64 machines out of the box. (The Mac's own
        # BCM4331 b43 firmware is baked separately by scripts/stage-b43-firmware.sh — it is non-distributable
        # and in no apt package.) Curated to the common families, not the exotic long tail; see size note below.
        firmware-iwlwifi        # Intel Wi-Fi (iwlwifi) — the single most common laptop wifi family.
        firmware-realtek        # Realtek Wi-Fi + Ethernet — ubiquitous on consumer hardware.
        firmware-atheros        # Qualcomm/Atheros ath9k/ath10k Wi-Fi.
        firmware-brcm80211      # Broadcom brcmfmac Wi-Fi (newer Broadcom; NOT the Mac's b43 chip).
        firmware-amd-graphics   # amdgpu KMS firmware — Ryzen/AMD-APU laptops need it EARLY or the display is
                                #   broken/blank. Biggest single blob here; first candidate to cut if 2G is tight.
        firmware-sof-signed     # Intel SOF DSP audio firmware — most post-2016 laptops' speakers/mic.
        firmware-misc-nonfree   # Grab-bag incl. Intel i915 GuC/HuC + assorted GPU/NIC blobs for KMS elsewhere.
        # NOTE(size, MEASURED 2026-08-28): base root is a FIXED 2G A/B verity slot (mkosi.repart/10-root.conf).
        # The DESKTOP is a separate sysext partition, so the root holds only the lean base (~480 MB used pre-
        # change). This firmware+daemon group adds ~400 MB → root ~900 MB (~45% of 2G, ~1 GB headroom): it
        # FITS, no geometry change. If a future firmware expansion overflows, systemd-repart FAILS loudly at
        # build — then bump the A+B root slots equally (the 17G target has slack). True everything-firmware +
        # discrete GPU (nouveau/nvidia) remains a deliberate size+geometry follow-up, intentionally not here.

# The repo overlay tree (image/overlay/) is copied into the image root: the disabled unit files,
# and — staged by build-in-container.sh BEFORE mkosi runs — the release binaries at
# /usr/libexec/shrek/ and the docs at /usr/share/doc/shrek/.
ExtraTrees=overlay

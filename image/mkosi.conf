# Shrek OS Phase-1 base image (skeleton) — see ../docs/phase1-spike.md.
# Drafted by the local coder tier, reviewed on the primary model. Built inside a debian:trixie
# container (scripts/build-in-container.sh); the beepboop host stays untouched.
# NOTE: mkosi config is version-sensitive — every `# VERIFY` is validated at the S2 build, not here.

[Distribution]
Distribution=debian
Release=trixie

[Output]
Format=disk
# S7: versioned output. ImageId MUST precede Output= — mkosi expands the %i specifier only from
# settings parsed *earlier* in the section, so `Output=%i_…` with ImageId below it silently yields an
# empty %i (verified via `mkosi summary`). Order matches particleos. Output=%i_%v_%a →
# shrek_<version>_x86-64.raw, and the split artifacts inherit the version so systemd-sysupdate's @v
# wildcard matches them (docs/phase1-s7-sysupdate.md). Version comes from image/mkosi.version (the
# harness writes 1 or 2). SplitArtifacts copies the root/verity partitions + signed UKI out as the
# standalone files the sysupdate [Source] installs into the inactive slot.
ImageId=shrek
Output=%i_%v_%a
CompressOutput=no
OutputDirectory=../out
SplitArtifacts=partitions,uki

[Content]
Bootable=yes
Bootloader=systemd-boot
UnifiedKernelImages=yes          # VERIFY: key name on target mkosi (>= v24)
# S7: name the UKI with the version so both A/B UKIs coexist in the ESP and systemd-boot boots the
# newest; sysupdate's boot-counting appends +@l-@d to this stem (docs/phase1-s7-sysupdate.md).
UnifiedKernelImageFormat=%i_%v_%a
Locale=C.UTF-8

# Root account: NO password is baked into the base image (locked by default).
# Dogfood-0 (M1): root autologin is REPLACED by a non-root `dev` autologin on tty1. mkosi's
# `Autologin=yes` would autologin ROOT on every getty (tty1 + serial); instead a baked getty@tty1
# drop-in (image/overlay/usr/lib/systemd/system/getty@tty1.service.d/autologin.conf) runs
# `agetty --autologin dev`, and getty@tty1 is force-enabled (getty.target.wants) so it starts at
# multi-user. pam_systemd (libpam-systemd, below) then registers dev's logind session on seat0 — the
# seat sway's libseat→logind backend needs for the DRM device ACLs. The interactive desktop is still
# started from /etc/profile.d/zz-shrek-desktop.sh (unchanged; guarded on /dev/dri/card0 so it fires
# only on the graphical dogfood VM, never the headless CI serial gate). The serial getty stays a normal
# login prompt (the CI proofs read SHREK_GATE off the console, not a login), so they are unaffected.

# S4 (DONE): dm-verity sealing is wired via mkosi.repart/ (00-esp, 10-root Verity=data,
#            20-root-verity Verity=hash). systemd-repart builds the sealed root + hash tree; mkosi
#            injects roothash= into the UKI cmdline. Unsigned verity — authenticated by the UKI sig at S5.
# TODO(S5): UKI signed with the Shrek key (SecureBoot* / --secure-boot-* keys) attaches here.
# S7 (in progress): A/B update is systemd-sysupdate, NOT bootc — bootc/composefs are unpackaged on
#            Debian (docs/phase1-s7-sysupdate.md). Disk gets A/B root+verity slots + a writable /var;
#            image/mkosi.sysupdate/ holds the transfer defs. systemd-sysupdate ships in systemd-container.

Packages=
        systemd
        systemd-boot
        systemd-boot-efi        # provides /usr/lib/systemd/boot/efi/linuxx64.efi.stub — required to build the UKI
        systemd-container       # S7: Debian ships /usr/lib/systemd/systemd-sysupdate here (the A/B update engine)
        libcryptsetup12         # Phase 2: systemd dlopens libcryptsetup.so.12 to set up dm-verity for signed
                                #          sysext/confext layers at merge time — without it `systemd-sysext merge`
                                #          fails "libcryptsetup.so.12 is not installed" (verified in-container).
        systemd-resolved
        udev
        dbus-broker
        libpam-systemd          # Dogfood-0 (M0): pam_systemd — the autologin PAM session registers with
                                #   logind (seat0 + XDG_RUNTIME_DIR), which grants the active session the
                                #   DRM/input device ACLs sway's libseat(logind) backend needs.
        login                   # Dogfood-0 (M0): /bin/login — agetty --autologin execs it (PAM entry point).
        sudo                    # Dogfood-0 (M1): NOPASSWD sudo for the dev user (sudoers.d/dev-nopasswd),
                                #   so admin work in the dogfood box needs no password — dev's own password
                                #   is LOCKED (passwd -l shape), matching the live-session account model.
        linux-image-amd64
        ca-certificates
        apparmor
        apparmor-utils
        less
        iproute2                # Phase-5 slice-3: `ip` — the egress plane's netns/veth plumbing
        nftables                # Phase-5 slice-3: `nft` — the per-sandbox egress allow-list/masquerade
        e2fsprogs               # Phase-5 slice-8 (S6 VM gate ONLY, spike): `mkfs.ext4 -O verity` to
                                #          provision the dedicated runtime fs-verity fs the positive-pin
                                #          gate measures against. Strip with the gate scaffolding.

# The repo overlay tree (image/overlay/) is copied into the image root: the disabled unit files,
# and — staged by build-in-container.sh BEFORE mkosi runs — the release binaries at
# /usr/libexec/shrek/ and the docs at /usr/share/doc/shrek/.
ExtraTrees=overlay

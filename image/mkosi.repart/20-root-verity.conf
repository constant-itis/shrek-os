# Shrek OS Phase-1 — S4 sealing: the verity HASH partition (the dm-verity Merkle tree).
# Verity=hash + the same VerityMatchKey=root binds it to the data partition in 10-root.conf.
# systemd-repart builds the hash tree over the data partition and reports the roothash; mkosi puts
# that roothash on the UKI cmdline. Verbatim from mkosi's own confext/portable/sysext verity defs.
# No root-verity-sig partition here — that (and a verity signing key) is deferred; the roothash is
# authenticated by the signed UKI at S5, not by an enrolled verity certificate.
[Partition]
Type=root-verity
Verity=hash
VerityMatchKey=root
Minimize=best

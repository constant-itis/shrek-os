# Shrek OS Phase-1 — S7: ESP holds systemd-boot + BOTH A/B UKIs (docs/phase1-s7-sysupdate.md).
# Grown from 512M (S4) to 1G because two versioned UKIs must coexist here (~136M each) plus the
# auto-enroll keys and boot-counting rename copies. Otherwise the S4 default (mkosi 25.3 make_disk).
[Partition]
Type=esp
Format=vfat
CopyFiles=/boot:/
CopyFiles=/efi:/
SizeMinBytes=1G
SizeMaxBytes=1G

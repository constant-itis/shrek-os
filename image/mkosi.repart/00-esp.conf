# Shrek OS Phase-1 — S4 sealing (docs/phase1-spike.md).
# Providing mkosi.repart/ REPLACES mkosi's auto-generated disk layout, so we must define every
# partition ourselves. This ESP definition is mkosi 25.3's own default for a bootable disk image
# (mkosi/__init__.py make_disk: Type=esp, vfat, CopyFiles=/boot:/ + /efi:/, 512M) reproduced
# verbatim so the UKI placement/bootloader install is unchanged from the S2 baseline.
[Partition]
Type=esp
Format=vfat
CopyFiles=/boot:/
CopyFiles=/efi:/
SizeMinBytes=512M
SizeMaxBytes=512M

# Shrek OS Phase-1 — S7: the EMPTY B-slot for the root DATA partition (docs/phase1-s7-sysupdate.md).
# Label=_empty is systemd-repart's marker for a reserved, unpopulated partition; systemd-sysupdate
# installs the next version's root image HERE (into the inactive slot) while slot A keeps running.
# No CopyFiles / no Verity= keys — it is raw reserved space until an update fills it. NoAuto=1 keeps
# the boot-time gpt-auto-generator from trying to mount this empty partition. Size == slot A.
[Partition]
Type=root
Label=_empty
NoAuto=1
SizeMinBytes=2G
SizeMaxBytes=2G

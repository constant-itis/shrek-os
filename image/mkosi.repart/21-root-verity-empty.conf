# Shrek OS Phase-1 — S7: the EMPTY B-slot for the root VERITY (hash) partition.
# Pairs with 20-root-empty.conf; sysupdate writes the next version's hash tree here. Label=_empty +
# NoAuto=1, size == slot A's hash partition. No Verity= keys (raw reserved space until updated).
[Partition]
Type=root-verity
Label=_empty
NoAuto=1
SizeMinBytes=100M
SizeMaxBytes=100M

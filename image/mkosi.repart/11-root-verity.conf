# Shrek OS Phase-1 — S7: the verity HASH partition, slot A (renamed from S4's 20-root-verity.conf).
# Verity=hash + the shared VerityMatchKey=root binds it to the data partition (10-root.conf); repart
# builds the Merkle tree and reports the roothash, which mkosi injects into the UKI cmdline (S4).
# Labelled + split for A/B like the data partition. Fixed 100M (dropped S4's Minimize=best) so the
# empty B hash slot matches — 100M dwarfs the ~16M tree over a 2G ext4.
[Partition]
Type=root-verity
Verity=hash
VerityMatchKey=root
Label=%M_%A_verity
SplitName=%t.%U
SizeMinBytes=100M
SizeMaxBytes=100M

# Shrek OS — Phase-6 Swamp slice-3: a dedicated PERSISTENT partition for the swamp index, mounted at
# /var/lib/swamp. The rest of /var stays VOLATILE (systemd.volatile=state → a fresh tmpfs each boot,
# image/mkosi.conf.d/25-writable-var.conf); ONLY this swamp derived-state store survives reboot, so the
# slice-3 persistence guarantee is delivered for real without changing the whole-/var model.
#
# Disposable DERIVED state, never authority: the index is a cache of filesystem facts. A wipe of this
# partition merely forces swampd to reconcile from the filesystem on next start — it can never grant a
# byte. It is NOT under dm-verity (verity seals /usr + root); it is ordinary writable storage.
#
# Mounted by the EXPLICIT unit var-lib-swamp.mount (by GPT partition label), NOT gpt-auto: Type=
# linux-generic is not an auto-mounted type and NoAuto=1 sets the no-auto GPT attribute, so the
# mountpoint is exactly /var/lib/swamp and nothing tries to mount it elsewhere. Small + fixed size.
[Partition]
Type=linux-generic
Format=ext4
Label=shrek-swamp
NoAuto=1
SizeMinBytes=128M
SizeMaxBytes=128M

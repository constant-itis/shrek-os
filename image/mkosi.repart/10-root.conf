# Shrek OS Phase-1 — S7: the verity DATA partition, slot A (populated with this version).
# Same S4 sealing (Verity=data + VerityMatchKey=root; roothash injected into the UKI cmdline), now
# labelled and split for A/B:
#   Label=%M_%A     → shrek_x86-64, and sysupdate relabels the slot shrek_<version> on install so the
#                     @v wildcard in the transfer MatchPattern can find it (docs/phase1-s7-sysupdate.md).
#   SplitName=%t.%U → the split artifact carries the partition-type + UUID so the transfer [Source]'s
#                     @u wildcard binds the UUID (systemd-repart sets this partition's UUID from the
#                     roothash, which is how gpt-auto/veritysetup pair data+hash at boot).
# Fixed 2G (dropped S4's Minimize=guess): the empty B slot must be sized to hold a future version, so
# both root slots are a fixed, equal size. ext4 kept from S4/S6 (proven boot); erofs is a later opt.
[Partition]
Type=root
Format=ext4
CopyFiles=/
Verity=data
VerityMatchKey=root
Label=%M_%A
SplitName=%t.%U
SizeMinBytes=2G
SizeMaxBytes=2G

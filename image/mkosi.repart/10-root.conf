# Shrek OS Phase-1 — S4 sealing: the verity DATA partition (the sealed root filesystem).
# Extends mkosi's default 10-root (Type=root / Format=<distro fs> / CopyFiles=/ / Minimize) with
# systemd-repart's verity keys, matching mkosi's own confext/portable/sysext verity definitions:
#   Verity=data + VerityMatchKey=root  pairs this partition with the hash partition (20-root-verity).
# systemd-repart computes the Merkle tree, and mkosi extracts the roothash from repart's JSON and
# injects `roothash=<hash>` into every UKI's kernel command line (finalize_roothash, __init__.py).
# dm-verity then enforces read-only integrity over the whole root at runtime — any tamper = hash fault.
#
# UNSIGNED verity at S4 (data + hash only, no root-verity-sig partition, no verity key): the roothash
# rides in the UKI cmdline and is authenticated later by the SIGNED UKI at S5 (Secure Boot chain).
# Format=ext4 (Debian's default) is kept from the S2 baseline to avoid a boot-time rootfs-module
# risk; erofs (smaller, natively read-only) is a later optimization. Minimize=guess (mkosi's default):
# systemd-repart rejects Minimize=best on a read-WRITE filesystem ("only ... with read-only
# filesystems or Verity=hash"), so `best` stays on the hash partition and the ext4 data partition
# uses `guess`. The roothash is deterministic regardless — it is the Merkle root over the final bytes.
[Partition]
Type=root
Format=ext4
CopyFiles=/
Verity=data
VerityMatchKey=root
Minimize=guess

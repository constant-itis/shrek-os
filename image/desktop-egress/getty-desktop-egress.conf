# Shrek OS — desktop egress login gate (ADR-007 S1). SOURCE TEMPLATE.
#
# build-in-container.sh installs this as a getty@tty1 drop-in
# (image/overlay/etc/systemd/system/getty@tty1.service.d/20-desktop-egress.conf) ONLY for the INSTALLABLE
# product and the DOGFOOD proof — the two variants with a real uid-1000 desktop session to govern. The
# generated copy is gitignored; LIVE_INSTALLER (ephemeral ownerless live session, ADR-007 §9: no plane)
# and plain-CI (plane inert) never get it, so a failed nft load can never brick THEIR tty1.
#
# Requires= (not Wants=) makes this FAIL-CLOSED [R1-MF3/R2-MF-B]: if shrek-desktop-egress.service fails to
# load the sealed deny-by-default table, getty@tty1 refuses to start — the uid-1000 desktop session never
# comes up ungoverned. This reuses the exact getty Requires= precedent ADR-005 uses for the credential
# path. After= sequences the table strictly before the autologin session.
[Unit]
Requires=shrek-desktop-egress.service
After=shrek-desktop-egress.service
